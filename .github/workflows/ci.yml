name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout worker
        uses: actions/checkout@v5
        with:
          path: worker

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: worker/go.sum

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          working-directory: worker

      - name: Unit tests
        run: go test -race -count=1 ./...

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-lint
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout worker
        uses: actions/checkout@v5
        with:
          path: worker

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: worker/go.sum

      - name: Integration tests
        run: go test -p 1 -v -race -tags=integration -timeout=300s ./integration_test/...
